<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" type="image/svg+xml" href="/sigma.svg"/><title>Mathfolio</title>
  <!-- Apply the saved palette before the application bundle paints. -->
  <script>
    try {
      var savedAppearance = JSON.parse(localStorage.getItem('mathfolio-appearance-v1') || '{}');
      var savedTheme = savedAppearance.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : savedAppearance.theme;
      document.documentElement.dataset.theme = ['light', 'dark', 'kitty'].includes(savedTheme) ? savedTheme : 'light';
      document.documentElement.dataset.paper = ['paper', 'sage', 'blue', 'rose'].includes(savedAppearance.background) ? savedAppearance.background : 'paper';
    } catch (_) {}
  </script>
  <style>html{background:#f5f4ed}html[data-theme=dark],html[data-theme=dark] body{background:#171d1a;color:#e5ebe4;color-scheme:dark}html[data-theme=kitty],html[data-theme=kitty] body{background:#f8e8ee;color:#523343;color-scheme:light}</style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
